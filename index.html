<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rasio Ranger : Tantangan Matematika Masa Depan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdfa; /* mint green light */
            overflow-x: hidden;
        }
        .pastel-blue { background-color: #e0f2fe; }
        .pastel-yellow { background-color: #fef08a; }
        .pastel-mint { background-color: #ccfbf1; }
        
        .fade-in {
            animation: fadeIn 0.8s ease-in-out;
        }
        
        .slide-up {
            animation: slideUp 0.5s ease-out forwards;
        }

        .bounce-slow {
            animation: bounceSlow 3s infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounceSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #5eead4; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #14b8a6; }

        .emoji-lg { font-size: 3rem; margin: 0.2rem; }
        .emoji-md { font-size: 2rem; margin: 0.2rem; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-center items-center p-4">

    <!-- Main Container -->
    <div id="app-container" class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col" style="height: 90vh; max-height: 800px;">
        
        <!-- Start Screen -->
        <div id="start-screen" class="flex-1 flex flex-col items-center justify-center p-8 bg-gradient-to-br from-cyan-100 to-blue-200 fade-in relative">
            <div class="absolute top-4 right-4 animate-pulse text-yellow-400 text-6xl opacity-50"><i class="fas fa-star"></i></div>
            <div class="absolute bottom-10 left-10 text-teal-400 text-6xl opacity-50 bounce-slow"><i class="fas fa-rocket"></i></div>
            
            <h1 class="text-4xl md:text-6xl font-extrabold text-blue-600 mb-4 text-center drop-shadow-sm">Rasio Ranger</h1>
            <h2 class="text-xl md:text-2xl font-bold text-slate-700 mb-8 text-center">Tantangan Matematika Masa Depan</h2>
            
            <div class="bg-white/80 backdrop-blur rounded-2xl p-6 shadow-lg mb-8 w-full max-w-md">
                <h3 class="font-bold text-lg mb-4 text-center border-b pb-2">Pengaturan Misi</h3>
                
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="font-semibold text-sm">Suara Narator:</span>
                        <div class="flex space-x-2">
                            <button onclick="setVoice('male')" id="btn-voice-male" class="px-3 py-1 rounded-full bg-blue-500 text-white text-sm transition shadow">Laki-laki</button>
                            <button onclick="setVoice('female')" id="btn-voice-female" class="px-3 py-1 rounded-full bg-gray-200 text-gray-700 text-sm transition shadow">Perempuan</button>

                    </div>
                    <div class="flex justify-between items-center">
                        <span class="font-semibold text-sm">Kecepatan:</span>
                        <select id="speed-select" class="bg-gray-100 rounded-lg p-1 text-sm outline-none cursor-pointer">
                            <option value="1">Normal</option>
                            <option value="0.8">Lambat</option>
                        </select>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="font-semibold text-sm">Teks Subtitle:</span>
                        <label class="relative inline-flex items-center cursor-pointer">

                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-teal-500"></div>

                    </div>
                </div>
            </div>

            <button onclick="startGame()" class="px-8 py-4 bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-white font-bold rounded-full shadow-xl transform transition hover:scale-105 text-xl flex items-center gap-3">

        </div>

        <!-- Game Screen (Hidden Initially) -->
        <div id="game-screen" class="hidden flex-1 flex-col h-full bg-white relative">
            
            <!-- Topbar / Header -->

                        <i class="fas fa-robot"></i>
                    </div>
                    <div>
                        <h3 id="scene-title" class="font-bold text-slate-800 text-lg leading-tight">Misi Rahasia</h3>
                        <div class="w-48 h-2 bg-gray-200 rounded-full mt-1">
                            <div id="progress-bar" class="h-2 bg-teal-500 rounded-full transition-all duration-500" style="width: 0%"></div>

                    </div>
                </div>

                    </button>

            </div>

            <!-- Content Area (Visuals) -->

            </div>

            <!-- Quiz / Interaction Panel -->

                    <!-- Options injected by JS -->
                </div>
                <div class="flex gap-4">
                    <button onclick="showHint()" id="btn-hint" class="px-4 py-2 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 font-semibold transition text-sm">

            </div>

            <!-- Subtitle & Navigation Area -->

                </button>

                    <p id="subtitle-text" class="text-sm md:text-lg font-medium leading-snug">

                    </p>

                    <i class="fas fa-chevron-right"></i>
                </button>

    </div>

    <!-- Custom Modal for Feedback / Hints -->
    <div id="custom-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">

            <p id="modal-body" class="text-slate-600 text-center mb-6">Pesan di sini.</p>

                <button onclick="closeModal()" class="px-6 py-2 bg-teal-500 text-white rounded-full font-bold hover:bg-teal-600 transition">Mengerti!</button>
            </div>
        </div>
    </div>

    <!-- Data & Script -->

                quiz: {
                    question: "Berapa gelas air yang diperlukan?",
                    options: ["14 Gelas", "18 Gelas", "21 Gelas", "28 Gelas"],
                    correct: 2, 
                    successMsg: "Sangat brilian! Sirup berubah dari 2 menjadi 6 (dikali 3). Air harus dikali 3 juga, dari 7 menjadi 21.",
                    failMsg: "Belum tepat, Detektif. Analisa lagi: 2 dikali berapa agar menjadi 6? Kalikan angka 7 (air) dengan bilangan pengali tersebut.",
                    hint: "Rasio sirup = 2, digunakan 6. Pengalinya = 6 ÷ 2 = 3. Maka kalikan 7 dengan 3."
                }
            },
            {
                id: 10,
                title: "Adegan 8: Rangkuman Visual",
                type: "story",
                visual: `
                    <div class="w-full max-w-3xl fade-in bg-white rounded-2xl p-6 shadow-lg border-t-8 border-teal-500">
                        <h3 class="text-xl font-bold text-center text-teal-600 mb-4">Misi Berhasil! Catatan Detektif 📝</h3>
                        <ul class="space-y-3 text-slate-700 font-medium">
                            <li class="flex items-start"><i class="fas fa-check-circle text-green-500 mt-1 mr-3"></i> <span>Rasio membandingkan dua kuantitas.</span></li>
                            <li class="flex items-start"><i class="fas fa-check-circle text-green-500 mt-1 mr-3"></i> <span><strong>Urutan</strong> dalam rasio harus diperhatikan.</span></li>
                            <li class="flex items-start"><i class="fas fa-check-circle text-green-500 mt-1 mr-3"></i> <span>Rasio dapat ditulis <em>a : b</em> atau pecahan <em>a/b</em>.</span></li>
                            <li class="flex items-start"><i class="fas fa-check-circle text-green-500 mt-1 mr-3"></i> <span>Rasio senilai diperoleh dengan mengalikan/membagi kedua suku dengan bilangan yang sama.</span></li>
                            <li class="flex items-start"><i class="fas fa-check-circle text-green-500 mt-1 mr-3"></i> <span>Rasio membantu menyelesaikan persoalan sehari-hari.</span></li>
                        </ul>
                    </div>
                `,
                narration: "Sekarang, kalian sudah mengetahui rahasia rasio! Ingat, perhatikan urutan, tulis perbandingannya dengan tepat, lalu sederhanakan jika diperlukan."
            },
            {
                id: 11,
                title: "Adegan 9: Refleksi & Penutup",
                type: "summary",
                visual: `
                    <div class="text-center fade-in">
                        <div class="text-6xl mb-4 bounce-slow">🏆 🎉</div>
                        <h2 class="text-3xl font-extrabold text-amber-500 mb-6 drop-shadow">Selamat, Detektif Matematika!</h2>
                        
                        <div class="bg-blue-50 p-6 rounded-2xl text-left border border-blue-200 inline-block">
                            <h4 class="font-bold text-slate-700 mb-3 border-b pb-2">Mari Berpikir Sejenak:</h4>
                            <ul class="list-disc pl-5 space-y-2 text-slate-600 font-medium">
                                <li>Apa hal baru yang kamu pelajari hari ini?</li>
                                <li>Bagian mana yang paling mudah dan menantang?</li>
                                <li>Di mana kamu dapat menemukan rasio dalam kehidupan sehari-hari?</li>
                            </ul>
                        </div>
                    </div>
                `,
                narration: "Selamat, Detektif Matematika! Kalian telah menyelesaikan misi rasio. Teruslah bertanya, mencoba, dan menjelaskan alasan dari setiap jawaban. Matematika akan terasa lebih mudah jika kita memahaminya langkah demi langkah. Sampai jumpa di petualangan berikutnya!"
            }
        ];

        // --- 2. STATE VARIABLES ---
        let currentSceneIndex = 0;
        let voicePref = 'male'; // 'male', 'female', 'none'
        let speedPref = 1;
        let showSubtitles = true;
        let synth = window.speechSynthesis;
        let isMuted = false;
        let quizAnsweredCorrectly = false;
        
        // --- Audio Context for SFX ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        
        function playSound(type) {
            if(isMuted) return;
            initAudio();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            if (type === 'correct') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); // A5
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'click') {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.1);
            }
        }


        // --- 3. CORE LOGIC ---
        function setVoice(type) {
            voicePref = type;
            document.getElementById('btn-voice-male').className = `px-3 py-1 rounded-full text-sm transition shadow ${type==='male' ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-700'}`;
            document.getElementById('btn-voice-female').className = `px-3 py-1 rounded-full text-sm transition shadow ${type==='female' ? 'bg-pink-500 text-white' : 'bg-gray-200 text-gray-700'}`;
            document.getElementById('btn-voice-none').className = `px-3 py-1 rounded-full text-sm transition shadow ${type==='none' ? 'bg-slate-500 text-white' : 'bg-gray-200 text-gray-700'}`;
            if(type === 'none') {
                isMuted = true;
                synth.cancel();
            } else {
                isMuted = false;
            }
            playSound('click');
        }

        function startGame() {
            // Get Settings
            speedPref = parseFloat(document.getElementById('speed-select').value);
            showSubtitles = document.getElementById('subtitle-toggle').checked;
            
            initAudio(); // Initialize audio context on user gesture
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');
            
            // Subtitle Visibility
            const subContainer = document.getElementById('subtitle-text').parentElement.parentElement;
            if(!showSubtitles) {
                document.getElementById('subtitle-text').style.opacity = "0";
            }
            
            currentSceneIndex = 0;
            loadScene();
        }

        function backToMenu() {
            synth.cancel();
            playSound('click');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('flex');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function toggleAudio() {
            isMuted = !isMuted;
            const btn = document.getElementById('btn-audio-toggle');
            if (isMuted) {
                synth.cancel();
                btn.innerHTML = '<i class="fas fa-volume-mute text-red-500"></i>';
                btn.classList.add('bg-red-50');
            } else {
                btn.innerHTML = '<i class="fas fa-volume-up"></i>';
                btn.classList.remove('bg-red-50');
                speakText(scenes[currentSceneIndex].narration);
            }
        }

        function speakText(text) {
            synth.cancel(); // stop current speaking
            if (voicePref === 'none' || isMuted) return;

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.rate = speedPref;
            
            // Try to find an Indonesian voice
            const voices = synth.getVoices();
            const idVoices = voices.filter(v => v.lang.includes('id'));
            
            if (idVoices.length > 0) {
                // If we have options, just pick the first. 
                // Web Speech API usually only has 1 or 2 per language per browser.
                utterance.voice = idVoices[0]; 
            }

            // Simulate male/female using pitch if engine doesn't have distinct voices
            if (voicePref === 'male') {
                utterance.pitch = 0.8;
            } else if (voicePref === 'female') {
                utterance.pitch = 1.4;
            }

            synth.speak(utterance);
        }

        function loadScene() {
            const scene = scenes[currentSceneIndex];
            quizAnsweredCorrectly = false;
            
            // Update Header & Progress
            document.getElementById('scene-title').innerText = scene.title;
            const progressPct = ((currentSceneIndex + 1) / scenes.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPct}%`;
            
            // Update Visuals
            document.getElementById('visual-area').innerHTML = scene.visual;
            
            // Update Subtitle
            document.getElementById('subtitle-text').innerText = scene.narration;
            
            // Narration
            speakText(scene.narration);
            
            // Handle Type
            const quizArea = document.getElementById('quiz-area');
            const btnNext = document.getElementById('btn-next');
            const btnPrev = document.getElementById('btn-prev');
            
            btnPrev.disabled = currentSceneIndex === 0;

            if (scene.type === 'quiz') {
                quizArea.classList.remove('hidden');
                btnNext.disabled = true; // Must answer to proceed
                btnNext.classList.add('opacity-50', 'cursor-not-allowed');
                
                document.getElementById('quiz-question').innerText = scene.quiz.question;
                
                let optionsHtml = '';
                scene.quiz.options.forEach((opt, idx) => {
                    optionsHtml += `
                        <button onclick="checkAnswer(${idx})" id="opt-${idx}" class="p-3 bg-white border-2 border-slate-200 rounded-xl font-bold text-slate-700 hover:border-teal-400 hover:bg-teal-50 transition transform hover:scale-105">
                            ${opt}
                        </button>
                    `;
                });
                document.getElementById('quiz-options').innerHTML = optionsHtml;
                
            } else {
                quizArea.classList.add('hidden');
                btnNext.disabled = currentSceneIndex === scenes.length - 1;
                btnNext.classList.remove('opacity-50', 'cursor-not-allowed');
                
                if (currentSceneIndex === scenes.length - 1) {
                    btnNext.innerHTML = '<i class="fas fa-home"></i>';
                    btnNext.onclick = backToMenu;
                } else {
                    btnNext.innerHTML = '<i class="fas fa-chevron-right"></i>';
                    btnNext.onclick = nextScene;
                }
            }
        }

        function nextScene() {
            if (currentSceneIndex < scenes.length - 1) {
                playSound('click');
                currentSceneIndex++;
                loadScene();
            }
        }

        function prevScene() {
            if (currentSceneIndex > 0) {
                playSound('click');
                currentSceneIndex--;
                loadScene();
            }
        }

        // --- 4. QUIZ & MODAL LOGIC ---
        function checkAnswer(selectedIndex) {
            const scene = scenes[currentSceneIndex];
            const correctIndex = scene.quiz.correct;
            
            const btn = document.getElementById(`opt-${selectedIndex}`);
            
            if (selectedIndex === correctIndex) {
                // Correct
                playSound('correct');
                btn.classList.remove('border-slate-200', 'hover:border-teal-400');
                btn.classList.add('border-green-500', 'bg-green-100', 'text-green-800');
                
                quizAnsweredCorrectly = true;
                
                // Enable Next Button
                const btnNext = document.getElementById('btn-next');
                btnNext.disabled = false;
                btnNext.classList.remove('opacity-50', 'cursor-not-allowed');
                btnNext.classList.add('animate-bounce');
                setTimeout(() => btnNext.classList.remove('animate-bounce'), 2000);
                
                showModal('Benar Sekali!', scene.quiz.successMsg, '✅', 'text-green-500');
                speakText(scene.quiz.successMsg);
                
                // Disable all other buttons
                scene.quiz.options.forEach((_, idx) => {
                    document.getElementById(`opt-${idx}`).disabled = true;
                });

            } else {
                // Wrong
                playSound('wrong');
                btn.classList.add('border-red-500', 'bg-red-50', 'animate-shake');
                setTimeout(() => btn.classList.remove('animate-shake'), 500);
                
                showModal('Belum Tepat', scene.quiz.failMsg, '❌', 'text-red-500');
                speakText(scene.quiz.failMsg);
            }
        }

        function showHint() {
            const scene = scenes[currentSceneIndex];
            playSound('click');
            showModal('Petunjuk Detektif', scene.quiz.hint, '💡', 'text-amber-500');
            speakText(scene.quiz.hint);
        }

        function showModal(title, body, icon, iconColorClass) {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('modal-content');
            
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerText = body;
            
            const iconEl = document.getElementById('modal-icon');
            iconEl.innerText = icon;
            iconEl.className = `text-5xl text-center mb-4 ${iconColorClass}`;
            
            modal.classList.remove('hidden');
            // Trigger animation
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            playSound('click');
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('modal-content');
            
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300); // Wait for transition
        }

        // Initialize Web Speech voices check to avoid delay on first speak
        window.speechSynthesis.onvoiceschanged = function() {
            // Voices loaded
        };

        // Add shake animation to tailwind manually
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
            .animate-shake { animation: shake 0.3s ease-in-out; }
        `;
        document.head.appendChild(style);

    </script>
</body>
